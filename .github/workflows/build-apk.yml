name: Build APK

# The app has no Gradle wrapper and this repo ships no committed toolchain, so the APK is
# built here: the runner has the JDK and Android SDK that android/build.sh expects.
#
# A push that touches android/** rebuilds and commits the APK back to the repo, which is what
# Vercel serves at /titan-md.apk. Version bumps are therefore a one-line manifest edit.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already carries an Android SDK at /usr/local/lib/android/sdk, so this
      # only pins the paths build.sh reads. android-actions/setup-android is deliberately not
      # used: it shells out to sdkmanager and dies on the interactive licence prompt.
      - name: Locate the preinstalled Android SDK
        run: |
          set -euo pipefail
          for d in /usr/local/lib/android/sdk "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "ANDROID_SDK_ROOT=$d" >> "$GITHUB_ENV"
              echo "ANDROID_HOME=$d" >> "$GITHUB_ENV"
              SDK="$d"
              break
            fi
          done
          [ -n "${SDK:-}" ] || { echo "no Android SDK on this runner" >&2; exit 1; }
          echo "using $SDK"
          ls "$SDK"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          echo "cmdline-tools: $CMDLINE"
          [ -n "$CMDLINE" ] && echo "$CMDLINE" >> "$GITHUB_PATH"

      - name: Install platform 34 and build-tools 34.0.0
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_SDK_ROOT/build-tools"
          ls "$ANDROID_SDK_ROOT/platforms"
          test -f "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

      - name: Build
        run: ./android/build.sh

      - name: Stage the stable download name
        id: stage
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'android:versionName="[^"]+"' android/app/src/main/AndroidManifest.xml \
                    | sed -E 's/.*="([^"]+)".*/\1/' | head -1)
          BUILT=$(ls android/dist/titan-md-*-debug.apk)
          cp "$BUILT" titan-md.apk                       # stable name the site links to
          mkdir -p apk
          cp "$BUILT" "apk/titan-md-${VERSION}.apk"      # archived under its version
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum titan-md.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify the APK is well formed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("titan-md.apk")
          names = z.namelist()
          assert "AndroidManifest.xml" in names, "no AndroidManifest.xml"
          assert "classes.dex" in names, "no classes.dex"
          assert z.testzip() is None, "corrupt zip"
          print(f"APK OK: {len(names)} entries, {len(z.read('classes.dex'))} bytes of dex")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: titan-md-${{ steps.stage.outputs.version }}
          path: titan-md.apk
          if-no-files-found: error

      - name: Commit the APK back to the repo
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f titan-md.apk apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "Build TITAN MD ${{ steps.stage.outputs.version }} APK (sha256 ${{ steps.stage.outputs.sha256 }}) [skip ci]"
            git push
          fi
